<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>LaBrant &amp; Associates Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Jost:wght@300;400;500;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: a tape shelf. Each video is a VHS spine label; open it to read the J-card tracklist. Sticky search bar over the shelf. */
:root{
  --paper:#ECEEF1; --card:#FFFFFF; --ink:#14161B; --muted:#596070; --rule:#D3D8E0;
  --ballpoint:#2639B8; --ballpoint-soft:#E3E7FB; --hi:#FFE14D; --hi-ink:#14161B;
  --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1014; --card:#171A21; --ink:#E6E8ED; --muted:#99A1AF; --rule:#2A2F3A;
  --ballpoint:#93A0FF; --ballpoint-soft:#1F2547; --hi:#E9CF3B; --hi-ink:#111111; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1014; --card:#171A21; --ink:#E6E8ED; --muted:#99A1AF; --rule:#2A2F3A;
  --ballpoint:#93A0FF; --ballpoint-soft:#1F2547; --hi:#E9CF3B; --hi-ink:#111111; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:28px 56px}
a{color:var(--ballpoint)}
:focus-visible{outline:2px solid var(--ballpoint);outline-offset:2px}

/* masthead */
.mast{display:grid;gap:10px;padding-block:8px 18px}
.eyebrow{margin:0;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(32px,5vw,54px);line-height:.92;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.lede{margin:0;max-width:64ch;color:var(--muted)}


/* toolbar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:10px;border-bottom:1px solid var(--rule)}
.bar input,.bar select,.btn{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;min-height:38px}
.bar input{flex:1 1 260px;min-width:0}
.bar select{flex:0 1 190px;min-width:0}
.btn{cursor:pointer}
.btn:hover{border-color:var(--ballpoint)}
.count{flex:1 0 100%;margin:0;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* artist chips */
.artists{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-block:12px 4px}
.artists .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.chip{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:1px solid var(--rule);border-radius:999px;padding:3px 10px;cursor:pointer}
.chip b{font-family:var(--f-mono);font-weight:500;font-size:11px;color:var(--muted);margin-left:4px}
.chip:hover{border-color:var(--ballpoint);color:var(--ballpoint)}

/* shelf */
.shelf{display:grid;gap:8px;margin-top:12px}
.tape{background:var(--card);border:1px solid var(--rule);border-radius:6px}
.tape[open]{border-color:var(--ballpoint)}
.tape>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:3.2rem minmax(0,1.1fr) minmax(0,.9fr) minmax(0,.9fr) 1rem;gap:4px 14px;align-items:center;padding:12px 14px}
.tape>summary::-webkit-details-marker{display:none}
.rank{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--ballpoint);font-variant-numeric:tabular-nums}
.spine{display:grid;min-width:0}
.title{font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.05;text-transform:uppercase;letter-spacing:.015em}
.meta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pick{min-width:0;font-size:14px}
.pick .lbl{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chev{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);justify-self:end;transition:transform .15s}
.tape[open] .chev{transform:rotate(-135deg)}

.body{border-top:1px dashed var(--rule);padding:6px 14px 14px}
.tracks{list-style:none;margin:0;padding:0}
.trk,.thead{display:grid;grid-template-columns:2.2rem minmax(0,1.05fr) minmax(0,.95fr) minmax(0,1.25fr);gap:2px 14px;padding:7px 0;border-bottom:1px solid var(--rule)}
.thead{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:8px}
.trk:last-child{border-bottom:0}
.n{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.sec{color:var(--muted);font-size:14px}
.art{font-weight:600}
.song{min-width:0}
.trk>span{overflow-wrap:anywhere}
.trk.is-closer{background:var(--ballpoint-soft);border-radius:4px;padding-inline:6px;margin-inline:-6px}
.tag{display:inline-block;margin-left:6px;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ballpoint);border:1px solid var(--ballpoint);border-radius:3px;padding:0 4px;vertical-align:1px}
.unk{color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--card)}
.segb{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:0;padding:8px 12px;min-height:38px;cursor:pointer}
.segb+.segb{border-left:1px solid var(--rule)}
.segb[aria-pressed="true"]{background:var(--ballpoint);color:var(--card)}
.vlinks{margin:8px 0 2px}
.yt{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;text-decoration:none;color:var(--ballpoint);border:1px solid var(--rule);border-radius:4px;padding:3px 8px}
.yt:hover{border-color:var(--ballpoint);background:var(--ballpoint-soft)}
.ls{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.sp{display:inline-block;margin-left:8px;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:var(--ballpoint);border:1px solid var(--rule);border-radius:3px;padding:1px 6px;vertical-align:1px;white-space:nowrap}
.sp:hover{border-color:var(--ballpoint);background:var(--ballpoint-soft)}
.note{margin:10px 0 0;font-size:13px;color:var(--muted);max-width:75ch}
.empty{margin:12px 0 4px;color:var(--muted)}
mark{background:var(--hi);color:var(--hi-ink);border-radius:2px;padding:0 1px}
.none{padding:28px 4px;color:var(--muted)}

footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--rule);display:grid;gap:8px;font-size:13px;color:var(--muted)}
footer p{margin:0;max-width:80ch}

/* list tiles: toggle between the ranked 50, the Tony Hawk games and the crew's own film */
.views{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-block:2px 12px}
.view{display:grid;gap:2px;align-content:start;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:10px 12px;cursor:pointer}
.view:hover{border-color:var(--ballpoint)}
.view[aria-pressed="true"]{border-color:var(--ballpoint);background:var(--ballpoint-soft);box-shadow:inset 0 0 0 1px var(--ballpoint)}
.view .vk{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ballpoint)}
.view .vt{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.05;text-transform:uppercase;letter-spacing:.015em}
.view .vs{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.rank.txt{display:grid;font-size:26px;line-height:.95}
.rank.txt small{font-family:var(--f-mono);font-weight:500;font-size:10px;letter-spacing:.08em}
.rank.solo{font-size:19px;letter-spacing:.04em}
.grp{margin:16px 0 0;font-family:var(--f-mono);font-weight:500;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.watch{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;text-decoration:none;color:var(--card);background:var(--ink);border-radius:6px;padding:10px 14px;white-space:nowrap}
.watch:hover{background:var(--ballpoint)}
.watch .tri{width:0;height:0;border-left:9px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent}
@media (max-width:640px){.views{gap:6px}.view{padding:8px 9px}.view .vt{font-size:15px}.view .vs{display:none}}
@media (max-width:640px){
  .bar select{flex:1 1 100%}
  .btn{flex:1 1 0}
  .tape>summary{grid-template-columns:2.6rem minmax(0,1fr) 1rem}
  .pick{grid-column:2 / 4}
  .seg{flex:1 1 100%}
  .segb{flex:1 1 0}
  .chev{grid-row:1;grid-column:3}
  .thead{display:none}
  .trk{grid-template-columns:2rem minmax(0,1fr);gap:0 10px}
  .trk .sec{grid-column:2;font-size:12px;font-family:var(--f-mono)}
  .trk .art,.trk .song{grid-column:2}
  .trk .n{grid-row:1 / 4}
}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}

/* Gate: LaBrant & Associates brand, navy field with a white card. Single look in both themes. */
.gate{--navy:#232B5A;--slate:#435568;--gray:#B7B7B7;--white:#FFFFFF;--err:#A1262E;
  --f-brand:"Futura LT Pro","Futura PT",Futura,"Jost","Century Gothic",sans-serif;
  position:fixed;inset:0;z-index:50;display:grid;place-items:center;overflow:auto;
  background:var(--navy);color:var(--white);font-family:var(--f-brand);
  padding:max(24px,env(safe-area-inset-top,0px)) 16px max(24px,env(safe-area-inset-bottom,0px))}
.gcard{width:min(400px,100%);background:var(--white);color:var(--navy);border-radius:4px;padding:32px 28px 26px;display:grid;gap:16px;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.mark{display:grid;gap:2px;padding-bottom:14px;border-bottom:1px solid var(--gray)}
.mark .w1{font-weight:700;font-size:30px;letter-spacing:.02em;line-height:1}
.mark .w2{font-weight:300;font-size:16px;letter-spacing:.32em;text-transform:uppercase;color:var(--slate)}
.gk{margin:0;font-weight:500;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--slate)}
.gh{margin:0;font-weight:400;font-size:17px;line-height:1.4}
.gform{display:grid;gap:12px}
.gform label.pw{display:grid;gap:6px;font-size:13px;font-weight:500;color:var(--slate)}
.gform input[type=password]{font:inherit;font-size:16px;color:var(--navy);background:#fff;border:1px solid var(--gray);border-radius:3px;padding:11px 12px}
.gform input[type=password]:focus-visible{outline:2px solid var(--navy);outline-offset:1px;border-color:var(--navy)}
.rem{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--slate)}
.rem input{width:16px;height:16px;accent-color:var(--navy)}
.go{font:inherit;font-weight:500;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--navy);border:0;border-radius:3px;padding:12px 14px;cursor:pointer}
.go:hover{background:var(--slate)}
.go:focus-visible{outline:2px solid var(--slate);outline-offset:2px}
.go[disabled]{opacity:.7;cursor:wait}
.gerr{margin:0;min-height:1.3em;font-size:14px;color:var(--err)}
.gfoot{margin:6px 0 0;font-size:12px;color:var(--slate)}
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="gcard">
    <div class="mark" aria-label="LaBrant &amp; Associates"><span class="w1">LaBrant</span><span class="w2">&amp; Associates</span></div>
    <p class="gk">Internal portal</p>
    <p class="gh">Please enter the password to continue.</p>
    <form class="gform" id="gform" autocomplete="off">
      <label class="pw" for="gpw">Password<input id="gpw" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required></label>
      <label class="rem" for="grem"><input id="grem" type="checkbox"> Remember this device</label>
      <button class="go" id="ggo" type="submit">Continue</button>
      <p class="gerr" id="gerr" role="alert"></p>
    </form>
    <p class="gfoot">Authorized users only.</p>
  </div>
</div>
<div id="app" hidden></div>
<script>

function boot(ENTRIES){
const NONMAIN = /bonus|menu|alternate|trailer|slideshow/i;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const fold = s => Array.from(String(s)).map(c => c.normalize("NFD")[0]).join("").toLowerCase();
const GROUPS = {thps:"Bonus: Tony Hawk's Pro Skater", ssd:"SSD presents"};
let view = "top50";
let mode = "full";
const fmtN = n => n >= 1e6 ? (n/1e6).toFixed(1).replace(/\.0$/,"") + "M" : n >= 1e3 ? Math.round(n/1e3) + "K" : String(n);
const fmtT = t => `${t[1] === "?" ? "Unidentified" : esc(t[1])}${t[2] === "?" ? "" : `, "${esc(t[2])}"`}`;

ENTRIES.forEach(e => {
  e.closerIdx = -1;
  if (e.group === "top50") {
    e.id = "v" + e.rank;
    for (let i = e.tracks.length - 1; i >= 0; i--) { if (!NONMAIN.test(e.tracks[i][0])) { e.closerIdx = i; break; } }
    if (e.closerIdx < 0 && e.tracks.length) e.closerIdx = e.tracks.length - 1;
  }
  e.hay = fold(e.title + " " + e.company);
});
const inGroup = g => ENTRIES.filter(e => e.group === g);
const trackCount = g => inGroup(g).reduce((n,e) => n + e.tracks.length, 0);

function hl(text, q){
  const s = String(text);
  if (!q) return esc(s);
  const i = fold(s).indexOf(q);
  if (i < 0) return esc(s);
  return esc(s.slice(0,i)) + "<mark>" + esc(s.slice(i,i+q.length)) + "</mark>" + esc(s.slice(i+q.length));
}
function cell(text, q, cls){
  const unk = text === "?";
  return `<span class="${cls}${unk ? " unk" : ""}">${unk ? "?" : hl(text, q)}</span>`;
}
const spQuery = (a, s) => ((a === "?" ? "" : a) + " " + s.replace(/\s*\([^)]*\)/g, "").replace(/\s*\[[^\]]*\]/g, "")).replace(/\s+/g, " ").trim();
function spLink(t){
  if (t[2] === "?") return "";
  const q = spQuery(t[1], t[2]);
  return `<a class="sp" href="https://open.spotify.com/search/${encodeURIComponent(q)}" target="_blank" rel="noopener" aria-label="Find ${esc(q)} on Spotify">Spotify</a><a class="sp" href="https://www.youtube.com/results?search_query=${encodeURIComponent(q)}" target="_blank" rel="noopener" aria-label="Find ${esc(q)} on YouTube">YouTube</a>`;
}

// tile counts
$("#vs-top50").textContent = `1995 to 2008 · ${trackCount("top50").toLocaleString()} tracks`;
$("#vs-thps").textContent = `1, 2 and 3 · ${trackCount("thps")} tracks`;

// artist chips, top 50 only
const artistCount = {};
inGroup("top50").forEach(e => e.tracks.forEach(t => { if (t[1] !== "?") artistCount[t[1]] = (artistCount[t[1]]||0) + 1; }));
const topArtists = Object.entries(artistCount).sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0])).slice(0,12);
$("#artists").insertAdjacentHTML("beforeend", topArtists.map(([a,n]) => `<button class="chip" type="button" data-q="${esc(a)}">${esc(a)}<b>${n}</b></button>`).join(""));

// companies
[...new Set(ENTRIES.filter(e => e.tracks.length).map(e => e.company))].sort((a,b) => a.localeCompare(b)).forEach(c => {
  const o = document.createElement("option"); o.value = c; o.textContent = c; $("#co").appendChild(o);
});

// shelf
let html = "", lastGroup = "top50";
ENTRIES.forEach(e => {
  if (e.group !== lastGroup) { html += `<h2 class="grp" data-group="${e.group}" hidden>${esc(GROUPS[e.group])}</h2>`; lastGroup = e.group; }
  let badge, sum;
  if (e.group === "top50") {
    badge = `<span class="rank">${pad(e.rank)}</span>`;
    const c = e.tracks[e.closerIdx];
    const tp = e.topIdx >= 0 ? e.tracks[e.topIdx] : null;
    sum = e.tracks.length
      ? `<span class="pick"><span class="lbl">Top track</span>${tp ? fmtT(tp) : "Not ranked yet"}</span><span class="pick"><span class="lbl">Closes with</span>${c ? fmtT(c) : ""}</span>`
      : `<span class="pick"><span class="lbl">Soundtrack</span>No tracklist catalogued</span><span class="pick"></span>`;
  } else {
    badge = e.group === "thps" ? `<span class="rank txt"><small>THPS</small>${esc(e.num)}</span>` : `<span class="rank txt solo">SSD</span>`;
    sum = `<span class="pick"><span class="lbl">${esc(e.sumLabel)}</span>${esc(e.sumText)}</span><span class="pick">${e.sum2Label ? `<span class="lbl">${esc(e.sum2Label)}</span>${esc(e.sum2Text)}` : ""}</span>`;
  }
  const meta = e.group === "ssd" ? `${esc(e.company)} · ${e.year} · ${e.tracks.length} songs` : `${esc(e.company)} · ${e.year} · ${e.tracks.length} tracks`;
  html += `<details class="tape" id="${e.id}" data-group="${e.group}">
    <summary>${badge}<span class="spine"><span class="title">${esc(e.title)}</span><span class="meta">${meta}</span></span>${sum}<span class="chev" aria-hidden="true"></span></summary>
    <div class="body"></div>
  </details>`;
});
html += `<p class="none" id="none" hidden>No tracks match. Try a shorter search or clear the company filter.</p>`;
$("#shelf").innerHTML = html;

function note(e){
  const link = e.watch ? "" : `<a href="${esc(e.url)}" target="_blank" rel="noopener">Source: ${esc(e.src || "SkateVideoSite")}</a>`;
  return `<p class="note">${e.notes ? esc(e.notes) + " " : ""}${link}</p>`;
}
function renderBody(e, q, titleHit){
  const el = document.querySelector(`#${e.id} .body`);
  if (!e.tracks.length) {
    el.innerHTML = (e.watch
      ? `<p class="empty">Tracklist and skater list coming soon.</p><p><a class="watch" href="${esc(e.watch)}" target="_blank" rel="noopener"><span class="tri" aria-hidden="true"></span>Watch on YouTube</a></p>`
      : `<p class="empty">No tracklist is catalogued for this video.</p>`) + note(e);
    return 0;
  }
  const top5 = mode === "top5" && e.group === "top50";
  const order = top5 ? (e.pop || []).slice(0,5) : e.tracks.map((_,i) => [i, null]);
  let rows = "", shown = 0;
  order.forEach(([i, lis], k) => {
    const t = e.tracks[i];
    if (q && !titleHit && !t.some(x => fold(x).includes(q))) return;
    shown++;
    const isC = i === e.closerIdx, isT = i === e.topIdx;
    const tags = (isT ? '<span class="tag">top track</span>' : "") + (isC ? '<span class="tag">closer</span>' : "");
    rows += `<li class="trk${isC && !top5 ? " is-closer" : ""}"><span class="n">${top5 ? "#" + (k+1) : pad(i+1)}</span>${cell(t[0],q,"sec")}${cell(t[1],q,"art")}<span class="song${t[2]==="?"?" unk":""}">${t[2]==="?"?"?":hl(t[2],q)}${tags}${spLink(t)}${top5 && lis ? `<span class="ls">${fmtN(lis)} Last.fm listeners · track ${i+1}</span>` : ""}${top5 && !lis && e.crewPick && isT ? `<span class="ls">SSD crew pick · track ${i+1}</span>` : ""}</span></li>`;
  });
  const vq = e.group === "top50" ? `${e.company} ${e.title} ${e.year} skate video` : `${e.title} soundtrack`;
  const vlink = e.watch
    ? `<p class="vlinks"><a class="watch" href="${esc(e.watch)}" target="_blank" rel="noopener"><span class="tri" aria-hidden="true"></span>Watch ${esc(e.title)} on YouTube</a></p>`
    : `<p class="vlinks"><a class="yt" href="https://www.youtube.com/results?search_query=${encodeURIComponent(vq)}" target="_blank" rel="noopener">Find the ${e.group === "top50" ? "video" : "soundtrack"} on YouTube</a></p>`;
  const head = `<div class="thead" aria-hidden="true"><span>#</span><span>Section</span><span>Artist</span><span>Song</span></div>`;
  const empty = top5 && !order.length ? `<p class="empty">Top tracks are not ranked for this video yet.</p>` : "";
  el.innerHTML = vlink + empty + (order.length ? head + `<ol class="tracks">${rows}</ol>` : "") + note(e);
  return shown;
}

function apply(){
  const q = fold($("#q").value.trim());
  const co = $("#co").value;
  const cross = !!(q || co) && view === "top50";

const KEY = "lba-portal-key-v1";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const tob64 = buf => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
const gerr = document.getElementById("gerr"), ggo = document.getElementById("ggo"), gpw = document.getElementById("gpw");
async function decryptWith(key){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.i)}, key, b64(P.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function keyFromPassword(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(P.s), iterations:P.n, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
function reveal(payload){
  const app = document.getElementById("app");
  app.innerHTML = payload.html;
  document.getElementById("gate").remove();
  app.hidden = false;
  document.title = "Top 50 Skate Video Soundtracks";
  boot(payload.data);
  const lock = document.getElementById("lock");
  if (lock) lock.addEventListener("click", () => { try { localStorage.removeItem(KEY); } catch(e){} location.reload(); });
}
(async () => {
  if (!window.crypto || !crypto.subtle) {
    gerr.textContent = "This page has to be opened over a secure (https) connection.";
    ggo.disabled = true; return;
  }
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  if (saved) {
    try {
      const k = await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"]);
      reveal(await decryptWith(k)); return;
    } catch(e){ try { localStorage.removeItem(KEY); } catch(_){} }
  }
  gpw.focus();
})();
document.getElementById("gform").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = gpw.value.trim().toLowerCase();
  if (!pw) return;
  gerr.textContent = ""; ggo.disabled = true; ggo.textContent = "Checking";
  try {
    const key = await keyFromPassword(pw);
    const payload = await decryptWith(key);
    if (document.getElementById("grem").checked) {
      try { localStorage.setItem(KEY, tob64(await crypto.subtle.exportKey("raw", key))); } catch(_){}
    }
    reveal(payload);
  } catch(err) {
    gerr.textContent = "That password didn't work. Check it and try again.";
    ggo.disabled = false; ggo.textContent = "Continue"; gpw.select();
  }
});
